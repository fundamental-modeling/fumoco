# The JS hooks (local, below) use the project's own tools and configs:
# run `npm ci` once before committing.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: check-added-large-files
    args: [--maxkb=500]
    exclude: ^package-lock\.json$
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-yaml
  - id: mixed-line-ending
  - id: check-symlinks
  - id: end-of-file-fixer
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.6
  hooks:
  - id: insert-license
    name: insert-license (js)
    files: \.(js|mjs|cjs|gjs)$
    args:
    - --license-filepath
    - ./etc/license-header.txt
    - --comment-style
    - //
  - id: insert-license
    name: insert-license (css)
    files: \.css$
    args:
    - --license-filepath
    - ./etc/license-header.txt
    - --comment-style
    - /*| *| */
  - id: insert-license
    name: insert-license (hash)
    files: \.(sh|yaml|yml)$
    args:
    - --license-filepath
    - ./etc/license-header.txt
- repo: local
  hooks:
  # YAML is formatted by pretty-format-yaml above, not prettier.
  - id: prettier
    name: prettier
    entry: npx prettier --write --ignore-unknown
    language: system
    files: \.(js|mjs|cjs|gjs|css|json|md)$
    exclude: ^package-lock\.json$
  - id: eslint
    name: eslint
    entry: npx eslint --fix
    language: system
    files: \.(js|mjs|cjs|gjs)$
  - id: ember-template-lint
    name: ember-template-lint
    entry: npx ember-template-lint --fix
    language: system
    files: \.(gjs|hbs)$
  - id: stylelint
    name: stylelint
    entry: npx stylelint --fix
    language: system
    files: \.css$
